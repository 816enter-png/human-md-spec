<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 1024" width="1440" height="1024">
  <defs>
    <filter id="shadow1">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#000" flood-opacity="0.08"/>
    </filter>
    <filter id="shadow2">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#000" flood-opacity="0.06"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1440" height="1024" rx="20" fill="#E6E6E6"/>

  <!-- Top Navigation Bar -->
  <rect x="40" y="24" width="1360" height="56" rx="28" fill="#0E0E0E" fill-opacity="0.8" filter="url(#shadow1)"/>
  <text x="80" y="58" fill="white" font-family="D-DIN, sans-serif" font-size="20" font-weight="bold" letter-spacing="0.05em">human.md</text>
  <text x="320" y="58" fill="white" font-family="NU Sans, Inter, sans-serif" font-size="14" font-weight="bold" opacity="0.8">File Schema</text>
  <text x="1360" y="58" fill="#888888" font-family="Inter, sans-serif" font-size="13" text-anchor="end">PAGE 2 / 5</text>

  <!-- Title -->
  <text x="80" y="128" fill="#0C0C0C" font-family="D-DIN, sans-serif" font-size="32" font-weight="bold">human.md File Structure</text>
  <text x="80" y="156" fill="#888888" font-family="NU Sans, Inter, sans-serif" font-size="15" font-weight="bold">YAML front matter + 10 markdown sections with per-section privacy controls</text>

  <!-- YAML Front Matter Card -->
  <g filter="url(#shadow1)">
    <rect x="80" y="180" width="400" height="280" rx="20" fill="white" fill-opacity="0.5"/>
  </g>
  <text x="110" y="210" fill="#0C0C0C" font-family="D-DIN, sans-serif" font-size="16" font-weight="bold">YAML Front Matter</text>
  <rect x="300" y="196" width="60" height="22" rx="11" fill="#0A0F1A"/>
  <text x="330" y="210" fill="#6B7FFF" font-family="Inter, sans-serif" font-size="10" font-weight="bold" text-anchor="middle">META</text>
  <rect x="110" y="224" width="340" height="1" fill="#333333" opacity="0.15"/>
  <text x="110" y="248" fill="#666666" font-family="NU Sans, Inter, sans-serif" font-size="12" font-weight="bold">version: "1.0"</text>
  <text x="110" y="268" fill="#666666" font-family="NU Sans, Inter, sans-serif" font-size="12" font-weight="bold">schema: "humanmd/v1"</text>
  <text x="110" y="288" fill="#666666" font-family="NU Sans, Inter, sans-serif" font-size="12" font-weight="bold">signature: "Ed25519:base64..."</text>
  <text x="110" y="308" fill="#666666" font-family="NU Sans, Inter, sans-serif" font-size="12" font-weight="bold">module_id: "BIM-xxxx-xxxx"</text>
  <text x="110" y="328" fill="#666666" font-family="NU Sans, Inter, sans-serif" font-size="12" font-weight="bold">active_profile: "default"</text>
  <text x="110" y="348" fill="#666666" font-family="NU Sans, Inter, sans-serif" font-size="12" font-weight="bold">updated: "2026-03-31T12:00:00Z"</text>
  <text x="110" y="380" fill="#00E87A" font-family="NU Sans, Inter, sans-serif" font-size="12" font-weight="bold">Cryptographic signature proves authenticity</text>
  <text x="110" y="400" fill="#00E87A" font-family="NU Sans, Inter, sans-serif" font-size="12" font-weight="bold">Tamper detection via Ed25519 verification</text>
  <rect x="110" y="418" width="340" height="1" fill="#333333" opacity="0.15"/>
  <text x="110" y="440" fill="#888888" font-family="NU Sans, Inter, sans-serif" font-size="11" font-weight="bold">Machine-readable  ·  Validates integrity  ·  Links to BIM hardware</text>

  <!-- 10 Sections Grid -->
  <!-- Section 1 -->
  <g filter="url(#shadow2)">
    <rect x="520" y="180" width="280" height="72" rx="14" fill="white" fill-opacity="0.5"/>
  </g>
  <text x="540" y="208" fill="#0C0C0C" font-family="D-DIN, sans-serif" font-size="14" font-weight="bold">1. Identity</text>
  <text x="540" y="230" fill="#666666" font-family="NU Sans, Inter, sans-serif" font-size="11" font-weight="bold">Name, pronouns, language, timezone</text>
  <rect x="730" y="198" width="56" height="18" rx="9" fill="#0A1A0F"/>
  <text x="758" y="210" fill="#00E87A" font-family="Inter, sans-serif" font-size="9" font-weight="bold" text-anchor="middle">PUBLIC</text>

  <!-- Section 2 -->
  <g filter="url(#shadow2)">
    <rect x="820" y="180" width="280" height="72" rx="14" fill="white" fill-opacity="0.5"/>
  </g>
  <text x="840" y="208" fill="#0C0C0C" font-family="D-DIN, sans-serif" font-size="14" font-weight="bold">2. Communication</text>
  <text x="840" y="230" fill="#666666" font-family="NU Sans, Inter, sans-serif" font-size="11" font-weight="bold">Tone, verbosity, formality prefs</text>
  <rect x="1030" y="198" width="56" height="18" rx="9" fill="#0A1A0F"/>
  <text x="1058" y="210" fill="#00E87A" font-family="Inter, sans-serif" font-size="9" font-weight="bold" text-anchor="middle">PUBLIC</text>

  <!-- Section 3 -->
  <g filter="url(#shadow2)">
    <rect x="1120" y="180" width="280" height="72" rx="14" fill="white" fill-opacity="0.5"/>
  </g>
  <text x="1140" y="208" fill="#0C0C0C" font-family="D-DIN, sans-serif" font-size="14" font-weight="bold">3. Cognitive Style</text>
  <text x="1140" y="230" fill="#666666" font-family="NU Sans, Inter, sans-serif" font-size="11" font-weight="bold">Learning style, detail level, examples</text>
  <rect x="1330" y="198" width="56" height="18" rx="9" fill="#0A0F1A"/>
  <text x="1358" y="210" fill="#6B7FFF" font-family="Inter, sans-serif" font-size="9" font-weight="bold" text-anchor="middle">REQUEST</text>

  <!-- Section 4 -->
  <g filter="url(#shadow2)">
    <rect x="520" y="268" width="280" height="72" rx="14" fill="white" fill-opacity="0.5"/>
  </g>
  <text x="540" y="296" fill="#0C0C0C" font-family="D-DIN, sans-serif" font-size="14" font-weight="bold">4. Accessibility</text>
  <text x="540" y="318" fill="#666666" font-family="NU Sans, Inter, sans-serif" font-size="11" font-weight="bold">Visual, auditory, motor, cognitive needs</text>
  <rect x="730" y="286" width="56" height="18" rx="9" fill="#0A1A0F"/>
  <text x="758" y="298" fill="#00E87A" font-family="Inter, sans-serif" font-size="9" font-weight="bold" text-anchor="middle">PUBLIC</text>

  <!-- Section 5 -->
  <g filter="url(#shadow2)">
    <rect x="820" y="268" width="280" height="72" rx="14" fill="white" fill-opacity="0.5"/>
  </g>
  <text x="840" y="296" fill="#0C0C0C" font-family="D-DIN, sans-serif" font-size="14" font-weight="bold">5. Emotional Boundaries</text>
  <text x="840" y="318" fill="#666666" font-family="NU Sans, Inter, sans-serif" font-size="11" font-weight="bold">Triggers, sensitivities, safe topics</text>
  <rect x="1030" y="286" width="56" height="18" rx="9" fill="#1A0A0A"/>
  <text x="1058" y="298" fill="#FF5F2E" font-family="Inter, sans-serif" font-size="9" font-weight="bold" text-anchor="middle">PRIVATE</text>

  <!-- Section 6 -->
  <g filter="url(#shadow2)">
    <rect x="1120" y="268" width="280" height="72" rx="14" fill="white" fill-opacity="0.5"/>
  </g>
  <text x="1140" y="296" fill="#0C0C0C" font-family="D-DIN, sans-serif" font-size="14" font-weight="bold">6. Consent</text>
  <text x="1140" y="318" fill="#666666" font-family="NU Sans, Inter, sans-serif" font-size="11" font-weight="bold">Autonomous / Confirm / Prohibited tiers</text>
  <rect x="1330" y="286" width="56" height="18" rx="9" fill="#1A0A0A"/>
  <text x="1358" y="298" fill="#E00061" font-family="Inter, sans-serif" font-size="9" font-weight="bold" text-anchor="middle">CORE</text>

  <!-- Section 7 -->
  <g filter="url(#shadow2)">
    <rect x="520" y="356" width="280" height="72" rx="14" fill="white" fill-opacity="0.5"/>
  </g>
  <text x="540" y="384" fill="#0C0C0C" font-family="D-DIN, sans-serif" font-size="14" font-weight="bold">7. Profiles</text>
  <text x="540" y="406" fill="#666666" font-family="NU Sans, Inter, sans-serif" font-size="11" font-weight="bold">Work, Medical, Home — sparse overrides</text>
  <rect x="730" y="374" width="56" height="18" rx="9" fill="#0A0F1A"/>
  <text x="758" y="386" fill="#6B7FFF" font-family="Inter, sans-serif" font-size="9" font-weight="bold" text-anchor="middle">SWITCH</text>

  <!-- Section 8 -->
  <g filter="url(#shadow2)">
    <rect x="820" y="356" width="280" height="72" rx="14" fill="white" fill-opacity="0.5"/>
  </g>
  <text x="840" y="384" fill="#0C0C0C" font-family="D-DIN, sans-serif" font-size="14" font-weight="bold">8. Sensory</text>
  <text x="840" y="406" fill="#666666" font-family="NU Sans, Inter, sans-serif" font-size="11" font-weight="bold">Light, sound, temperature preferences</text>
  <rect x="1030" y="374" width="56" height="18" rx="9" fill="#0A0F1A"/>
  <text x="1058" y="386" fill="#6B7FFF" font-family="Inter, sans-serif" font-size="9" font-weight="bold" text-anchor="middle">REQUEST</text>

  <!-- Section 9 -->
  <g filter="url(#shadow2)">
    <rect x="1120" y="356" width="280" height="72" rx="14" fill="white" fill-opacity="0.5"/>
  </g>
  <text x="1140" y="384" fill="#0C0C0C" font-family="D-DIN, sans-serif" font-size="14" font-weight="bold">9. UI Dashboard</text>
  <text x="1140" y="406" fill="#666666" font-family="NU Sans, Inter, sans-serif" font-size="11" font-weight="bold">Personal interface for screen projection</text>
  <rect x="1330" y="374" width="56" height="18" rx="9" fill="#1A0A1A"/>
  <text x="1358" y="386" fill="#E00061" font-family="Inter, sans-serif" font-size="9" font-weight="bold" text-anchor="middle">RENDER</text>

  <!-- Section 10 -->
  <g filter="url(#shadow2)">
    <rect x="520" y="444" width="280" height="72" rx="14" fill="white" fill-opacity="0.5"/>
  </g>
  <text x="540" y="472" fill="#0C0C0C" font-family="D-DIN, sans-serif" font-size="14" font-weight="bold">10. Custom</text>
  <text x="540" y="494" fill="#666666" font-family="NU Sans, Inter, sans-serif" font-size="11" font-weight="bold">User-defined extensions and metadata</text>
  <rect x="730" y="462" width="56" height="18" rx="9" fill="#262626"/>
  <text x="758" y="474" fill="#888888" font-family="Inter, sans-serif" font-size="9" font-weight="bold" text-anchor="middle">OPEN</text>

  <!-- Consent Tiers Card -->
  <g filter="url(#shadow1)">
    <rect x="80" y="540" width="620" height="200" rx="20" fill="white" fill-opacity="0.5"/>
  </g>
  <text x="110" y="572" fill="#0C0C0C" font-family="D-DIN, sans-serif" font-size="16" font-weight="bold">Three-Tier Consent Model</text>
  <rect x="110" y="586" width="560" height="1" fill="#333333" opacity="0.15"/>

  <!-- Autonomous -->
  <rect x="110" y="600" width="16" height="16" rx="4" fill="#00E87A"/>
  <text x="136" y="614" fill="#0C0C0C" font-family="D-DIN, sans-serif" font-size="14" font-weight="bold">Autonomous</text>
  <text x="260" y="614" fill="#666666" font-family="NU Sans, Inter, sans-serif" font-size="12" font-weight="bold">Agent acts freely within defined scope</text>
  <text x="110" y="634" fill="#888888" font-family="NU Sans, Inter, sans-serif" font-size="11" font-weight="bold">Example: adjust text size, use preferred name, set language</text>

  <!-- Confirm -->
  <rect x="110" y="652" width="16" height="16" rx="4" fill="#FD7600"/>
  <text x="136" y="666" fill="#0C0C0C" font-family="D-DIN, sans-serif" font-size="14" font-weight="bold">Confirm</text>
  <text x="260" y="666" fill="#666666" font-family="NU Sans, Inter, sans-serif" font-size="12" font-weight="bold">Agent must ask before acting</text>
  <text x="110" y="686" fill="#888888" font-family="NU Sans, Inter, sans-serif" font-size="11" font-weight="bold">Example: share location, make purchases, contact others</text>

  <!-- Prohibited -->
  <rect x="110" y="704" width="16" height="16" rx="4" fill="#E00061"/>
  <text x="136" y="718" fill="#0C0C0C" font-family="D-DIN, sans-serif" font-size="14" font-weight="bold">Prohibited</text>
  <text x="260" y="718" fill="#666666" font-family="NU Sans, Inter, sans-serif" font-size="12" font-weight="bold">Agent must never do this, period</text>
  <text x="110" y="738" fill="#888888" font-family="NU Sans, Inter, sans-serif" font-size="11" font-weight="bold">Example: share medical data, record conversations, override boundaries</text>

  <!-- Profile Override Model Card -->
  <g filter="url(#shadow1)">
    <rect x="740" y="540" width="620" height="200" rx="20" fill="white" fill-opacity="0.5"/>
  </g>
  <text x="770" y="572" fill="#0C0C0C" font-family="D-DIN, sans-serif" font-size="16" font-weight="bold">Context-Switching Profiles</text>
  <rect x="770" y="586" width="560" height="1" fill="#333333" opacity="0.15"/>
  <text x="770" y="612" fill="#888888" font-family="NU Sans, Inter, sans-serif" font-size="13" font-weight="bold">Sparse override model: profiles only change what's different</text>

  <!-- Profile pills -->
  <rect x="770" y="628" width="80" height="28" rx="14" fill="#0A1A0F"/>
  <text x="810" y="646" fill="#00E87A" font-family="D-DIN, sans-serif" font-size="12" font-weight="bold" text-anchor="middle">Work</text>
  <text x="870" y="646" fill="#666666" font-family="NU Sans, Inter, sans-serif" font-size="12" font-weight="bold">Formal tone, limited personal data, org affiliation visible</text>

  <rect x="770" y="666" width="80" height="28" rx="14" fill="#1A0A0A"/>
  <text x="810" y="684" fill="#FF5F2E" font-family="D-DIN, sans-serif" font-size="12" font-weight="bold" text-anchor="middle">Medical</text>
  <text x="870" y="684" fill="#666666" font-family="NU Sans, Inter, sans-serif" font-size="12" font-weight="bold">Full accessibility, allergies, emergency contacts exposed</text>

  <rect x="770" y="704" width="80" height="28" rx="14" fill="#0A0F1A"/>
  <text x="810" y="722" fill="#6B7FFF" font-family="D-DIN, sans-serif" font-size="12" font-weight="bold" text-anchor="middle">Home</text>
  <text x="870" y="722" fill="#666666" font-family="NU Sans, Inter, sans-serif" font-size="12" font-weight="bold">Full sensory prefs, casual tone, smart home integrations</text>

  <!-- Broadcast Scope Card -->
  <g filter="url(#shadow1)">
    <rect x="80" y="760" width="1280" height="160" rx="20" fill="white" fill-opacity="0.5"/>
  </g>
  <text x="110" y="792" fill="#0C0C0C" font-family="D-DIN, sans-serif" font-size="16" font-weight="bold">Per-Section Broadcast Scope</text>
  <rect x="110" y="806" width="1220" height="1" fill="#333333" opacity="0.15"/>

  <!-- Scope levels -->
  <rect x="110" y="822" width="280" height="40" rx="10" fill="#0A1A0F"/>
  <text x="250" y="846" fill="#00E87A" font-family="D-DIN, sans-serif" font-size="13" font-weight="bold" text-anchor="middle">PUBLIC — Always broadcast</text>

  <rect x="420" y="822" width="280" height="40" rx="10" fill="#0A0F1A"/>
  <text x="560" y="846" fill="#6B7FFF" font-family="D-DIN, sans-serif" font-size="13" font-weight="bold" text-anchor="middle">REQUEST — Agent must ask first</text>

  <rect x="730" y="822" width="280" height="40" rx="10" fill="#1A0A0A"/>
  <text x="870" y="846" fill="#FF5F2E" font-family="D-DIN, sans-serif" font-size="13" font-weight="bold" text-anchor="middle">PRIVATE — Encrypted, local only</text>

  <rect x="1040" y="822" width="280" height="40" rx="10" fill="#1A0A1A"/>
  <text x="1180" y="846" fill="#E00061" font-family="D-DIN, sans-serif" font-size="13" font-weight="bold" text-anchor="middle">HIDDEN — Never leaves module</text>

  <text x="110" y="896" fill="#888888" font-family="NU Sans, Inter, sans-serif" font-size="13" font-weight="bold">Each of the 10 sections can be independently assigned a broadcast scope — granular privacy by design, not by afterthought</text>

  <!-- Bottom bar -->
  <rect x="40" y="944" width="1360" height="56" rx="28" fill="#EFEFEF" fill-opacity="0.5" filter="url(#shadow2)"/>
  <text x="80" y="978" fill="#0C0C0C" font-family="NU Sans, Inter, sans-serif" font-size="16" font-weight="bold">humanmd.app</text>
  <text x="300" y="978" fill="#888888" font-family="NU Sans, Inter, sans-serif" font-size="13" font-weight="bold">Standard markdown — readable by humans AND machines</text>
  <text x="1360" y="978" fill="#666666" font-family="NU Sans, Inter, sans-serif" font-size="13" text-anchor="end">816 Enterprises LLC</text>
  <circle cx="640" cy="976" r="6" fill="#00E87A"/>
  <circle cx="662" cy="976" r="6" fill="#6B7FFF"/>
  <circle cx="684" cy="976" r="6" fill="#FF5F2E"/>
  <circle cx="706" cy="976" r="6" fill="#E00061"/>
  <circle cx="728" cy="976" r="6" fill="#FD7600"/>
</svg>