<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 1024" width="1440" height="1024">
  <defs>
    <filter id="blur1">
      <feGaussianBlur in="SourceGraphic" stdDeviation="5"/>
    </filter>
    <filter id="shadow1">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#000" flood-opacity="0.08"/>
    </filter>
    <filter id="shadow2">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#000" flood-opacity="0.06"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1440" height="1024" rx="20" fill="#E6E6E6"/>

  <!-- Top Navigation Bar -->
  <rect x="40" y="24" width="1360" height="56" rx="28" fill="#0E0E0E" fill-opacity="0.8" filter="url(#shadow1)"/>
  <text x="80" y="58" fill="white" font-family="D-DIN, sans-serif" font-size="20" font-weight="bold" letter-spacing="0.05em">human.md</text>
  <text x="320" y="58" fill="white" font-family="NU Sans, Inter, sans-serif" font-size="14" font-weight="bold" opacity="0.8">System Overview</text>
  <text x="1360" y="58" fill="#888888" font-family="Inter, sans-serif" font-size="13" text-anchor="end">PAGE 1 / 5</text>

  <!-- Title Section -->
  <text x="80" y="128" fill="#0C0C0C" font-family="D-DIN, sans-serif" font-size="32" font-weight="bold">5-Layer Architecture</text>
  <text x="80" y="156" fill="#888888" font-family="NU Sans, Inter, sans-serif" font-size="15" font-weight="bold">Biometric-gated portable identity module for human-AI communication</text>

  <!-- LAYER 1: Biometric Authentication -->
  <g filter="url(#shadow1)">
    <rect x="80" y="190" width="1280" height="130" rx="20" fill="white" fill-opacity="0.5"/>
  </g>
  <text x="110" y="220" fill="#0C0C0C" font-family="Inter, sans-serif" font-size="22" letter-spacing="0em">&#x25a9;</text>
  <text x="140" y="220" fill="#0C0C0C" font-family="D-DIN, sans-serif" font-size="18" font-weight="bold">Layer 1 — Biometric Authentication</text>
  <rect x="420" y="204" width="80" height="24" rx="12" fill="#0A1A0F"/>
  <text x="460" y="220" fill="#00E87A" font-family="Inter, sans-serif" font-size="11" font-weight="bold" text-anchor="middle">SECURE</text>
  <text x="110" y="248" fill="#888888" font-family="NU Sans, Inter, sans-serif" font-size="14" font-weight="bold">Fingerprint sensor validates human owner before any data leaves the module</text>
  <text x="110" y="272" fill="#666666" font-family="NU Sans, Inter, sans-serif" font-size="13" font-weight="bold">Skin contact detection  ·  Capacitive fingerprint  ·  Secure element (ATECC608B)  ·  Ed25519 key pair</text>
  <rect x="110" y="290" width="1220" height="1" fill="#333333" opacity="0.15"/>
  <text x="110" y="308" fill="#00E87A" font-family="NU Sans, Inter, sans-serif" font-size="13" font-weight="bold">Gate: Nothing broadcasts until fingerprint match confirms human presence</text>

  <!-- LAYER 2: Guided App -->
  <g filter="url(#shadow1)">
    <rect x="80" y="340" width="1280" height="130" rx="20" fill="white" fill-opacity="0.5"/>
  </g>
  <text x="110" y="370" fill="#0C0C0C" font-family="Inter, sans-serif" font-size="22">&#x2af4;</text>
  <text x="140" y="370" fill="#0C0C0C" font-family="D-DIN, sans-serif" font-size="18" font-weight="bold">Layer 2 — Guided Companion App</text>
  <rect x="420" y="354" width="80" height="24" rx="12" fill="#0A0F1A"/>
  <text x="460" y="370" fill="#6B7FFF" font-family="Inter, sans-serif" font-size="11" font-weight="bold" text-anchor="middle">AUTHOR</text>
  <text x="110" y="398" fill="#888888" font-family="NU Sans, Inter, sans-serif" font-size="14" font-weight="bold">Conversational interface guides humans through creating their human.md identity file</text>
  <text x="110" y="422" fill="#666666" font-family="NU Sans, Inter, sans-serif" font-size="13" font-weight="bold">10 structured sections  ·  Plain language prompts  ·  Privacy controls per section  ·  Profile switching</text>
  <rect x="110" y="440" width="1220" height="1" fill="#333333" opacity="0.15"/>
  <text x="110" y="458" fill="#6B7FFF" font-family="NU Sans, Inter, sans-serif" font-size="13" font-weight="bold">Output: Valid human.md file with YAML front matter + markdown sections</text>

  <!-- LAYER 3: human.md File -->
  <g filter="url(#shadow1)">
    <rect x="80" y="490" width="1280" height="130" rx="20" fill="white" fill-opacity="0.5"/>
  </g>
  <text x="110" y="520" fill="#0C0C0C" font-family="Inter, sans-serif" font-size="22">&#x25a3;</text>
  <text x="140" y="520" fill="#0C0C0C" font-family="D-DIN, sans-serif" font-size="18" font-weight="bold">Layer 3 — human.md Identity File</text>
  <rect x="420" y="504" width="80" height="24" rx="12" fill="#1A0A0A"/>
  <text x="460" y="520" fill="#FF5F2E" font-family="Inter, sans-serif" font-size="11" font-weight="bold" text-anchor="middle">CORE</text>
  <text x="110" y="548" fill="#888888" font-family="NU Sans, Inter, sans-serif" font-size="14" font-weight="bold">Portable, human-readable markdown file that tells AI agents who you are and how to interact with you</text>
  <text x="110" y="572" fill="#666666" font-family="NU Sans, Inter, sans-serif" font-size="13" font-weight="bold">Identity  ·  Communication  ·  Cognitive Style  ·  Accessibility  ·  Emotional Boundaries  ·  Consent  ·  Profiles  ·  Sensory  ·  UI Dashboard  ·  Custom</text>
  <rect x="110" y="590" width="1220" height="1" fill="#333333" opacity="0.15"/>
  <text x="110" y="608" fill="#FF5F2E" font-family="NU Sans, Inter, sans-serif" font-size="13" font-weight="bold">Format: Standard markdown + YAML front matter — readable by humans AND machines</text>

  <!-- LAYER 4: Biometric Identity Module -->
  <g filter="url(#shadow1)">
    <rect x="80" y="640" width="1280" height="130" rx="20" fill="white" fill-opacity="0.5"/>
  </g>
  <text x="110" y="670" fill="#0C0C0C" font-family="Inter, sans-serif" font-size="22">&#x29d6;</text>
  <text x="140" y="670" fill="#0C0C0C" font-family="D-DIN, sans-serif" font-size="18" font-weight="bold">Layer 4 — Biometric Identity Module (BIM)</text>
  <rect x="490" y="654" width="100" height="24" rx="12" fill="#0A1A0F"/>
  <text x="540" y="670" fill="#00E87A" font-family="Inter, sans-serif" font-size="11" font-weight="bold" text-anchor="middle">HARDWARE</text>
  <text x="110" y="698" fill="#888888" font-family="NU Sans, Inter, sans-serif" font-size="14" font-weight="bold">Form-factor agnostic physical module that stores, signs, and broadcasts your identity</text>
  <text x="110" y="722" fill="#666666" font-family="NU Sans, Inter, sans-serif" font-size="13" font-weight="bold">ESP32-S3  ·  BLE 5.0 + NFC  ·  Wi-Fi Direct  ·  Pendant / Ring / Clip / USB-C / Phone Case</text>
  <rect x="110" y="740" width="1220" height="1" fill="#333333" opacity="0.15"/>
  <text x="110" y="758" fill="#00E87A" font-family="NU Sans, Inter, sans-serif" font-size="13" font-weight="bold">Broadcast: Cryptographically signed identity to AI agents, robots, kiosks within proximity</text>

  <!-- LAYER 5: UI Projection -->
  <g filter="url(#shadow1)">
    <rect x="80" y="790" width="1280" height="130" rx="20" fill="white" fill-opacity="0.5"/>
  </g>
  <text x="110" y="820" fill="#0C0C0C" font-family="Inter, sans-serif" font-size="22">&#x25ce;</text>
  <text x="140" y="820" fill="#0C0C0C" font-family="D-DIN, sans-serif" font-size="18" font-weight="bold">Layer 5 — UI Projection</text>
  <rect x="370" y="804" width="100" height="24" rx="12" fill="#1A0A1A"/>
  <text x="420" y="820" fill="#E00061" font-family="Inter, sans-serif" font-size="11" font-weight="bold" text-anchor="middle">DISPLAY</text>
  <text x="110" y="848" fill="#888888" font-family="NU Sans, Inter, sans-serif" font-size="14" font-weight="bold">Projects your personal UI dashboard onto any compatible nearby screen</text>
  <text x="110" y="872" fill="#666666" font-family="NU Sans, Inter, sans-serif" font-size="13" font-weight="bold">Wi-Fi Direct handshake  ·  Sandboxed rendering  ·  Session = proximity  ·  Zero persistence on host</text>
  <rect x="110" y="890" width="1220" height="1" fill="#333333" opacity="0.15"/>
  <text x="110" y="908" fill="#E00061" font-family="NU Sans, Inter, sans-serif" font-size="13" font-weight="bold">Experience: Your personal dashboard follows you — any screen becomes YOUR screen</text>

  <!-- Flow arrows between layers -->
  <g opacity="0.3">
    <line x1="720" y1="320" x2="720" y2="340" stroke="#0C0C0C" stroke-width="2" stroke-dasharray="4,4"/>
    <line x1="720" y1="470" x2="720" y2="490" stroke="#0C0C0C" stroke-width="2" stroke-dasharray="4,4"/>
    <line x1="720" y1="620" x2="720" y2="640" stroke="#0C0C0C" stroke-width="2" stroke-dasharray="4,4"/>
    <line x1="720" y1="770" x2="720" y2="790" stroke="#0C0C0C" stroke-width="2" stroke-dasharray="4,4"/>
  </g>

  <!-- Bottom bar -->
  <rect x="40" y="944" width="1360" height="56" rx="28" fill="#EFEFEF" fill-opacity="0.5" filter="url(#shadow2)"/>
  <text x="80" y="978" fill="#0C0C0C" font-family="NU Sans, Inter, sans-serif" font-size="16" font-weight="bold">humanmd.app</text>
  <text x="300" y="978" fill="#888888" font-family="NU Sans, Inter, sans-serif" font-size="13" font-weight="bold">Outward Identity Projection — not inward extraction</text>
  <text x="1360" y="978" fill="#666666" font-family="NU Sans, Inter, sans-serif" font-size="13" text-anchor="end">816 Enterprises LLC</text>

  <!-- Accent dots (dock-style) -->
  <circle cx="640" cy="976" r="6" fill="#00E87A"/>
  <circle cx="662" cy="976" r="6" fill="#6B7FFF"/>
  <circle cx="684" cy="976" r="6" fill="#FF5F2E"/>
  <circle cx="706" cy="976" r="6" fill="#E00061"/>
  <circle cx="728" cy="976" r="6" fill="#FD7600"/>
</svg>